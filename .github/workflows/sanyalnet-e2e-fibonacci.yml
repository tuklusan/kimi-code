name: Sanyalnet E2E Fibonacci

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'Which runners? one | unix | all'
        required: true
        type: choice
        default: one
        options:
          - one
          - unix
          - all
      model:
        description: 'Model alias to run the pipeline on'
        required: true
        type: string
        default: nvidia/nvidia/llama-3.3-nemotron-super-49b-v1
      timeout_minutes:
        description: 'Per-runner timeout in minutes'
        required: true
        type: string
        default: '30'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      have_key: ${{ steps.check.outputs.have_key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NVIDIA_API_KEY not set; e2e is a no-op."
          fi

  run:
    needs: gate
    if: needs.gate.outputs.have_key == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            runner_group: one
          - os: ubuntu-24.04-arm
            target: linux-arm64
            runner_group: unix
          - os: macos-15-intel
            target: darwin-x64
            runner_group: unix
          - os: macos-15
            target: darwin-arm64
            runner_group: unix
          - os: windows-2025-vs2026
            target: win32-x64
            runner_group: all
          - os: windows-11-arm
            target: win32-arm64
            runner_group: all
    steps:
      - run: echo "would run pipeline on ${{ matrix.target }} (group ${{ matrix.runner_group }})"
