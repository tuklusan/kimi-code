name: Sanyalnet E2E Fibonacci

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'Which runners? one | unix | all'
        required: true
        type: choice
        default: one
        options:
          - one
          - unix
          - all
      model:
        description: 'Model alias to run the pipeline on'
        required: true
        type: string
        default: nvidia/nvidia/llama-3.3-nemotron-super-49b-v1
      timeout_minutes:
        description: 'Per-runner timeout in minutes'
        required: true
        type: string
        default: '30'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      have_key: ${{ steps.check.outputs.have_key }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NVIDIA_API_KEY not set; e2e is a no-op."
          fi

  run:
    needs: gate
    if: needs.gate.outputs.have_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "would run pipeline here"
