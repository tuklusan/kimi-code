name: Sanyalnet Release

# Downstream-fork release: builds unsigned native binaries via the existing
# `_native-build.yml` reusable workflow and publishes them as a GitHub Release
# tagged `kimi-code-sanyalnet-cli-vX.Y.Z`. Runs only on `tuklusan/kimi-code`
# (or any fork the user runs it from) — never on upstream MoonshotAI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without leading v; e.g. 0.0.1)'
        required: true
        type: string
        default: '0.0.1'
      prerelease:
        description: 'Mark this release as a pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sanyalnet-release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native binaries
    # `sign-macos: false` skips Apple keychain / notarization steps — the
    # personal fork has no Apple secrets. macOS binaries ship unsigned; users
    # will need to `xattr -d com.apple.quarantine` on first run.
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: kimi-code-sanyalnet-cli
      retention-days: 30
      sign-macos: false

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist-artifacts
          pattern: kimi-code-sanyalnet-cli-*
          merge-multiple: true

      - name: Show downloaded artifacts
        run: |
          echo "Contents of dist-artifacts:"
          find dist-artifacts -type f | sort

      - name: Rename artifacts to fork-branded names
        run: |
          set -euo pipefail
          cd dist-artifacts
          # Reusable workflow uploads zip files named
          # `kimi-code-<target>.zip` / `.sha256`. Rename to fork branding.
          for f in kimi-code-*.zip kimi-code-*.zip.sha256; do
            [ -e "$f" ] || continue
            newname="${f/kimi-code-/kimi-code-sanyalnet-cli-}"
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
              echo "renamed: $f -> $newname"
            fi
          done
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="kimi-code-sanyalnet-cli-v${VERSION}"
          TITLE="kimi-code-sanyalnet-cli rev ${VERSION}"
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          # kimi-code-sanyalnet-cli rev ${VERSION}

          Personal downstream fork of [MoonshotAI/kimi-code](https://github.com/MoonshotAI/kimi-code) with local tweaks. Not intended for upstream merge.

          ## What this fork adds on top of upstream

          - **SANYALnet Labs Software Development Company** — a preconfigured six-role AI software team (CEO, CPO, CTO, programmer, reviewer, tester) that turns a natural-language product requirement into working, reviewed, tested code through a five-phase SDLC pipeline (Inception → Blueprint → Implementation → Review → QA). Inspired by [ChatDev](https://github.com/OpenBMB/ChatDev). Full setup under [\`sanyalnet-lab/\`](https://github.com/tuklusan/kimi-code/tree/main/sanyalnet-lab) with an idempotent installer (\`sanyalnet-lab/bin/install.sh --autoload\`) that symlinks the six agent personas + the SDLC directive into \`\$KIMI_CODE_HOME\` and wires the autoload env var into \`~/.bashrc\`.
          - **\`KIMI_INITIAL_PROMPT_FILE\`** — env var that pre-populates the TUI editor with a file's contents on every fresh session (never on \`--continue\` / \`--session\` resumes). Lets recurring multi-agent primers (like the SDLC directive) load one Enter-press away.
          - **Per-provider \`send_prompt_cache_key\` opt-out** — for strict OpenAI-compatible gateways (NVIDIA NIM, some vLLM deployments) that reject unknown request params with HTTP 400. Auto-set on \`kimi provider catalog add\` for known strict endpoints (\`nvidia\`, \`nim\`, \`integrate.api.nvidia.com\`); overridable via \`kimi provider set <id> --send-prompt-cache-key <true|false>\`.
          - **\`KIMI_OUTBOUND_MIN_INTERVAL_MS\`** — minimum 1-second gap between model-driven outbound network calls (\`fetch_url\`, \`web_search\`). Shared across both tools so a runaway loop cannot hammer external hosts. Default \`1000\`; set to \`0\` to disable.
          - **Auto-update disabled by default** — this fork ships its own release binaries under the \`kimi-code-sanyalnet-cli-v*\` tags; the upstream update channel would otherwise silently replace the fork's binary. Opt back in with \`KIMI_CODE_AUTO_UPDATE=1\`.
          - **Multi-platform smoke test** — every push touching the fork's own tree runs the installer on all six release runners and asserts every persona and directive file lands correctly.
          - **End-to-end "company delivers software" acceptance workflow** — [Sanyalnet E2E Fibonacci](https://github.com/tuklusan/kimi-code/actions/workflows/sanyalnet-e2e-fibonacci.yml) drives the full five-phase pipeline against a real NVIDIA NIM model and asserts the delivered program prints exactly the first 20 Fibonacci numbers plus a docs file. Manual dispatch, gated on \`NVIDIA_API_KEY\` secret.

          ## Install the software company on a fresh box

          \`\`\`sh
          git clone https://github.com/tuklusan/kimi-code.git
          cd kimi-code/sanyalnet-lab
          ./bin/install.sh --autoload
          \`\`\`

          The installer prompts (once, silently) for the NVIDIA NIM API key on first run and writes a fresh \`~/.kimi-code/config.toml\`. From the next kimi launch, the SDLC directive auto-populates the editor — press Enter and the company starts Phase 1 immediately.

          ## Downloads

          Unsigned native binaries built via Node.js SEA on GitHub Actions runners. Six targets:

          | Platform | Artifact |
          |---|---|
          | Linux x64 | \`kimi-code-sanyalnet-cli-linux-x64.zip\` |
          | Linux arm64 | \`kimi-code-sanyalnet-cli-linux-arm64.zip\` |
          | macOS x64 (Intel) | \`kimi-code-sanyalnet-cli-darwin-x64.zip\` |
          | macOS arm64 (Apple Silicon) | \`kimi-code-sanyalnet-cli-darwin-arm64.zip\` |
          | Windows x64 | \`kimi-code-sanyalnet-cli-win32-x64.zip\` |
          | Windows arm64 | \`kimi-code-sanyalnet-cli-win32-arm64.zip\` |

          Each zip contains the \`kimi\` binary. macOS binaries are **unsigned** — after unzipping run \`xattr -d com.apple.quarantine kimi\` before first launch.

          Verify with the accompanying \`.sha256\` file: \`sha256sum -c kimi-code-sanyalnet-cli-<target>.zip.sha256\`.

          Built from commit ${GITHUB_SHA}.
          EOF

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${GITHUB_SHA}" \
            $PRERELEASE_FLAG \
            dist-artifacts/*.zip \
            dist-artifacts/*.zip.sha256
